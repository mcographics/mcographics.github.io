<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 920" fill="none">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#030303"/>
      <stop offset=".52" stop-color="#070604"/>
      <stop offset="1" stop-color="#020202"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2=".2">
      <stop stop-color="#623300"/>
      <stop offset=".18" stop-color="#e78b10"/>
      <stop offset=".31" stop-color="#fff0a5"/>
      <stop offset=".43" stop-color="#b95a00"/>
      <stop offset=".58" stop-color="#ffcb3f"/>
      <stop offset=".72" stop-color="#fff4bd"/>
      <stop offset=".84" stop-color="#cf7705"/>
      <stop offset="1" stop-color="#552700"/>
    </linearGradient>
    <radialGradient id="leftGlow" cx="0" cy="0" r="1" gradientTransform="matrix(470 300 -210 328 34 225)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff9c14" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ff9c14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="0" cy="0" r="1" gradientTransform="matrix(330 0 0 250 1668 83)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd66a" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ff8c00" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-70%" width="160%" height="240%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="hotGlow" x="-80%" y="-180%" width="260%" height="460%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <radialGradient id="spark">
      <stop stop-color="#fffef0"/>
      <stop offset=".12" stop-color="#fff7c4"/>
      <stop offset=".3" stop-color="#ffb11d" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ff8a00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <path fill="url(#night)" d="M0 0h1920v920H0z"/>
  <path fill="url(#leftGlow)" d="M0 0h1920v920H0z"/>
  <path fill="url(#rightGlow)" d="M0 0h1920v920H0z"/>

