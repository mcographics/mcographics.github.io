name: Check portfolio repository visibility

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-repository-visibility
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check repository visibility
        run: node scripts/check-repository-visibility.mjs
        env:
          PORTFOLIO_REPO_STATUS_TOKEN: ${{ secrets.PORTFOLIO_REPO_STATUS_TOKEN }}
      - name: Publish visibility changes
        shell: bash
        run: |
          if git diff --quiet -- app/repository-status.json; then
            echo "No visibility changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/repository-status.json
          git commit -m "Update portfolio repository visibility"
          git push
