name: Sync Work Day with God release metadata

on:
  repository_dispatch:
    types: [work-day-with-god-release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: work-day-with-god-release-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Synchronize release metadata
        run: npm run releases:sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish changed release metadata
        shell: bash
        run: |
          if git diff --quiet -- app/projects/work-day-with-god/releases.json; then
            echo "No Work Day with God release changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/projects/work-day-with-god/releases.json
          git commit -m "Update Work Day with God release metadata"
          git push
