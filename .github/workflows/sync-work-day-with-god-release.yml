name: Sync portfolio release metadata

on:
  repository_dispatch:
    types: [work-day-with-god-release, portfolio-release]
  workflow_dispatch:
  schedule:
    - cron: "47 9 * * *"

permissions:
  contents: write

concurrency:
  group: portfolio-release-metadata-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: Synchronize release metadata
        run: npm run releases:sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Synchronize public portfolio releases
        run: npm run portfolio:releases:sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish changed release metadata
        shell: bash
        run: |
          if git diff --quiet -- app/projects/work-day-with-god/releases.json app/repository-status.json; then
            echo "No Work Day with God release changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/projects/work-day-with-god/releases.json app/repository-status.json
          git commit -m "Update portfolio release metadata"
          git push
